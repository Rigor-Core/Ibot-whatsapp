<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ibot — Iniciar sesión</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-form-side">
      <div class="auth-form-header">
        <div class="logo-container">
          <div class="logo">IB</div>
        </div>
        <h2>Bienvenido de nuevo</h2>
        <p class="small">Introduce tus credenciales para acceder de forma segura a tu bot.</p>
      </div>
      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="username" class="field-label">Usuario</label>
          <input id="username" name="login_user_field" type="text" autocomplete="off" placeholder="Ingresa tu usuario" value="" required />
        </div>
        <div class="field">
          <label for="password" class="field-label">Contraseña</label>
          <div class="password-wrapper">
            <input id="password" name="login_pass_field" type="password" autocomplete="new-password" placeholder="••••••••" value="" required />
            <button type="button" class="toggle-password-btn" data-target="password" title="Mostrar/ocultar contraseña" aria-label="Mostrar contraseña">
              <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg class="icon-eye-off" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>
        <button id="loginBtn" class="btn full" type="submit">Iniciar Sesión</button>
        <div id="authMsg" class="auth-msg"></div>
      </form>
      <div class="auth-footer" style="color:var(--muted);font-size:12px;">
        Acceso exclusivo para administradores del sistema.
      </div>
    </div>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
