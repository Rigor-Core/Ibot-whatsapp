<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ibot — Contactos</title>
  <meta name="theme-color" content="#f5f6f8">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <style>
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; }
    .tab { background: none; border: 0; padding: 10px 14px; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .tab .count { font-weight: 600; color: var(--muted); margin-left: 4px; }
    .group-block { border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); overflow: hidden; }
    .group-block + .group-block { margin-top: 10px; }
    .group-block > summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
    .group-block > summary::-webkit-details-marker { display: none; }
    .group-block > summary .main { flex: 1; min-width: 0; }
    .group-block > summary .chev { transition: transform .15s; color: var(--muted); }
    .group-block[open] > summary .chev { transform: rotate(90deg); }
    .group-block .members { border-top: 1px solid var(--border); padding: 4px 14px 10px; }
    .contact-actions .btn { min-width: 34px; }
    .group-actions { display: flex; gap: 6px; align-items: center; flex: none; }
    .app select.ai-select { flex: none; width: auto; min-height: 32px; padding: 4px 26px 4px 10px; font-size: 12px; font-weight: 700; border-radius: 999px; }
    .app select.ai-select.allow { color: var(--good); border-color: var(--good); }
    .app select.ai-select.block { color: var(--danger); border-color: var(--danger); }
    .sched-when { font-weight: 700; }
    .sched-msg { color: var(--text-2); font-size: 13px; white-space: pre-wrap; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .load-more { display: flex; justify-content: center; padding-top: 10px; }
    @media (max-width: 640px) {
      .contact-actions .label, .group-actions .label { display: none; }
      .group-block > summary { flex-wrap: wrap; }
      .group-block > summary .main { flex: 1 1 calc(100% - 90px); }
      .group-actions { width: 100%; padding-left: 74px; }
      .list .list-item:has(.ai-select) { flex-wrap: wrap; }
      .list .list-item:has(.ai-select) .contact-actions { width: 100%; padding-left: 52px; }
    }
  </style>
</head>
<body class="app" data-page="contactos">
  <div class="app-shell">
    <nav class="app-nav" id="appNav" aria-label="Navegación principal"></nav>
    <main class="app-main">
      <div class="app-content">
        <header class="page-head">
          <div>
            <h1 class="page-title">Contactos</h1>
            <div class="page-sub">Integrantes de tus grupos, otros contactos y mensajes programados</div>
          </div>
          <div class="spacer"></div>
          <button class="btn" type="button" id="exportBtn" data-feature="exportContacts">Exportar CSV</button>
          <button class="btn" type="button" id="refreshBtn">Sincronizar</button>
        </header>

        <section class="grid grid-4">
          <div class="stat"><div class="stat-label">En tus grupos</div><div class="stat-value" id="kpiMembers">—</div></div>
          <div class="stat"><div class="stat-label">Otros contactos</div><div class="stat-value" id="kpiExternal">—</div></div>
          <div class="stat"><div class="stat-label">Grupos</div><div class="stat-value" id="kpiGroups">—</div></div>
          <div class="stat"><div class="stat-label">Programados pendientes</div><div class="stat-value" id="kpiScheduled">—</div></div>
        </section>

        <section class="card" style="margin-top:16px">
          <div class="toolbar">
            <input type="search" class="search" id="searchInput" placeholder="Buscar por nombre o número en todos tus contactos…" aria-label="Buscar contactos">
          </div>
          <nav class="tabs" id="tabs" role="tablist">
            <button class="tab active" type="button" data-tab="groups" role="tab">Grupos</button>
            <button class="tab" type="button" data-tab="external" role="tab">Otros contactos</button>
            <button class="tab" type="button" data-tab="scheduled" role="tab" data-feature="scheduleMessages">Programados<span class="count" id="scheduledCount"></span></button>
          </nav>
          <div id="panel" aria-live="polite"><div class="empty">Cargando…</div></div>
        </section>
      </div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/js/api.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/dialog.js"></script>
  <script src="/js/sticker-picker.js"></script>
  <script src="/js/schedule.js"></script>
  <script src="/js/contactos.js"></script>
</body>
</html>
